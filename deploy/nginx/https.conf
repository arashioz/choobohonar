# Used once /etc/letsencrypt/live/__SITE_DOMAIN__/ has a certificate.
# Storefront is served from https://__SITE_DOMAIN__
# Admin panel is served from https://admin.__SITE_DOMAIN__

# Port 80: ACME challenge and HTTP → HTTPS redirect preserving requested hostname
server {
  listen 80 default_server;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Port 443: www → apex redirect
server {
  listen 443 ssl;
  http2 on;
  server_name www.__SITE_DOMAIN__;

  ssl_certificate     /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;
  include /etc/nginx/site/ssl-params.conf;

  return 301 https://__SITE_DOMAIN__$request_uri;
}

# Port 443: Admin panel (https://admin.choobohonar.com)
server {
  listen 443 ssl;
  http2 on;
  server_name admin.__SITE_DOMAIN__;

  ssl_certificate     /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;
  include /etc/nginx/site/ssl-params.conf;

  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/site/admin.conf;
}

# Port 443: Main storefront (https://choobohonar.com)
server {
  listen 443 ssl default_server;
  http2 on;
  server_name __SITE_DOMAIN__;

  ssl_certificate     /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;
  include /etc/nginx/site/ssl-params.conf;

  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/site/app.conf;
}
