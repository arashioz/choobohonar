# Shared application routes, included inside every server block that serves
# the site (see http-only.conf and https.conf). Not a standalone config.

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend_upstream frontend:3000;
  set $backend_upstream  backend:3001;
  set $admin_upstream    admin:3003;
  set $landing_upstream  landing:5005;
  set $legacy_wp_origin  "__LEGACY_WP_ORIGIN__";

  client_max_body_size   500m;
  proxy_connect_timeout  30s;
  proxy_read_timeout     300s;
  proxy_send_timeout     300s;
  proxy_buffer_size      128k;
  proxy_buffers          4 256k;
  proxy_busy_buffers_size 256k;

  # ─── static uploads ───────────────────────────────────────────
  location ^~ /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
    # Uploaded videos are streamed directly by nginx (including byte-range
    # requests) and cached by the browser, rather than passing through Next.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Accept-Ranges bytes;
  }

  # ─── legacy WordPress media (/wp-content/uploads/*) ──────────
  # Catalog data still points at https://__SITE_DOMAIN__/wp-content/uploads/…
  # Serve a local copy when it exists; otherwise fetch it from the old
  # WordPress host (LEGACY_WP_ORIGIN) so images survive the DNS switch.
  location ^~ /wp-content/uploads/ {
    root /var/www/legacy;
    try_files $uri @legacy_wp;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location @legacy_wp {
    if ($legacy_wp_origin = "") { return 404; }
    proxy_pass $legacy_wp_origin$request_uri;
    proxy_set_header Host __SITE_DOMAIN__;
    proxy_ssl_server_name on;
    proxy_ssl_name __SITE_DOMAIN__;
    proxy_ssl_verify off;
    proxy_intercept_errors on;
    proxy_hide_header Set-Cookie;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # ─── campaign landing (/landing/*) ───────────────────────────
  location = /52 {
    # Next.js canonicalizes this base-path root to /landing (without a
    # trailing slash). Proxy it instead of redirecting to /landing/, which
    # would otherwise create an endless 301 ↔ 308 redirect loop.
    proxy_pass http://$landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # Keep the /landing prefix: the separate Next.js app is built with this
  # basePath, preventing its assets and routes from colliding with storefront.
  location ^~ /52/ {
    proxy_pass http://$landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }
  # ─── public api → backend ────────────────────────────────────
  location ^~ /api/public-cms/ {
    # With a variable upstream, including a URI in proxy_pass discards the
    # unmatched request suffix. Preserve the complete API URI instead.
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location ^~ /api/public/ {
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location ^~ /api/shop/ {
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # ─── public form submissions → backend ───────────────────────
  location = /api/lead {
    proxy_pass http://$backend_upstream/api/lead;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /api/interior-brief {
    proxy_pass http://$backend_upstream/api/interior-brief;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # ─── admin media upload → backend ─────────────────────────────
  # Exact browser URL: POST /admin/api/media
  # Must win over `location ^~ /admin/api/` (which used to send this to Next
  # and hit the ~10MB App Router body limit → 400 / connection reset).
  # Variable proxy_pass keeps the rewritten URI only when $uri is appended.
  location = /admin/api/media {
    client_max_body_size 500m;
    client_body_buffer_size 16m;
    client_body_timeout 900s;
    rewrite ^ /api/admin/upload break;
    proxy_pass http://$backend_upstream$uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location ^~ /admin/api/media {
    client_max_body_size 500m;
    client_body_buffer_size 16m;
    client_body_timeout 900s;
    rewrite ^ /api/admin/upload break;
    proxy_pass http://$backend_upstream$uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location = /api/admin/upload {
    client_max_body_size 500m;
    client_body_buffer_size 16m;
    client_body_timeout 900s;
    proxy_pass http://$backend_upstream$uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

 # ─── Admin API ────────────────────────────────────────────────
location ^~ /admin/api/ {
    # The public panel lives under /admin, but its Next route handlers are
    # defined at /api. Strip only the public prefix before proxying.
    rewrite ^/admin(/api/.*)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Legacy API paths → Admin API
# Keep browser URL as /api/...

location ^~ /api/auth/ { return 307 /admin$request_uri; }
location ^~ /api/cookies/ { return 307 /admin$request_uri; }
location ^~ /api/cms/ { return 307 /admin$request_uri; }
location ^~ /api/customers { return 307 /admin$request_uri; }
location ^~ /api/collections { return 307 /admin$request_uri; }
location ^~ /api/content/ { return 307 /admin$request_uri; }
location ^~ /api/leads { return 307 /admin$request_uri; }
  location = /api/settings/public {
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /api/settings { return 307 /admin$request_uri; }
location = /api/media { return 307 /admin$request_uri; }
  # ─── admin panel (/admin/*) ──────────────────────────────────
  # Next canonicalizes `/admin/` to `/admin`. Do not redirect this back to a
  # trailing slash here, otherwise nginx and Next create a 301 ↔ 308 loop.
  location = /admin {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # The asset prefix is public-only. The standalone Next server serves these
  # paths without `/admin`, so strip it before proxying.
  location ^~ /admin/_next/static/ {
    rewrite ^/admin(/_next/static/.*)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ^~ /admin/_next/image {
    rewrite ^/admin(/_next/image.*)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # All other /admin/*  →  admin:3003 keeping /admin prefix
  location ^~ /admin/ {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ─── frontend static ─────────────────────────────────────────
  location ~* ^/(?:_next/static|_next/image|font-face|static)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/(?:fonts|brand|images|videos)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # ─── catch-all → frontend ────────────────────────────────────
  # Variable upstreams drop the unmatched suffix unless the original URI
  # is appended. Keep $request_uri so encoded Persian collection slugs
  # reach Next instead of a decoded path that 404s against static params.
  location / {
    proxy_pass http://$frontend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
