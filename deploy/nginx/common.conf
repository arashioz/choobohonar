# http-level settings shared by both site modes.

# Behind a TLS-terminating CDN the request reaches nginx over plain HTTP;
# keep the original scheme so the apps build https URLs and secure cookies.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml image/svg+xml;
