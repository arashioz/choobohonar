server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend_upstream frontend:3000;
  set $backend_upstream  backend:3001;
  set $admin_upstream    admin:3003;
  set $landing_upstream  landing:5005;

  client_max_body_size   200m;
  proxy_connect_timeout  30s;
  proxy_read_timeout     300s;
  proxy_send_timeout     300s;
  proxy_buffer_size      128k;
  proxy_buffers          4 256k;
  proxy_busy_buffers_size 256k;

  # ─── static uploads ───────────────────────────────────────────
  location ^~ /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
    # Uploaded videos are streamed directly by nginx (including byte-range
    # requests) and cached by the browser, rather than passing through Next.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Accept-Ranges bytes;
  }

  # ─── campaign landing (/landing/*) ───────────────────────────
  location = /52 {
    # Next.js canonicalizes this base-path root to /landing (without a
    # trailing slash). Proxy it instead of redirecting to /landing/, which
    # would otherwise create an endless 301 ↔ 308 redirect loop.
    proxy_pass http://$landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # Keep the /landing prefix: the separate Next.js app is built with this
  # basePath, preventing its assets and routes from colliding with storefront.
  location ^~ /52/ {
    proxy_pass http://$landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }
  # ─── public api → backend ────────────────────────────────────
  location ^~ /api/public-cms/ {
    proxy_pass http://$backend_upstream/api/public-cms/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/public/ {
    proxy_pass http://$backend_upstream/api/public/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/shop/ {
    proxy_pass http://$backend_upstream/api/shop/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ─── admin api → admin:3003 ──────────────────────────────────
 # ─── Admin media upload ───────────────────────────────────────
# Keep the larger limit and longer timeout scoped to multipart media uploads.
location = /admin/api/media {
    client_max_body_size 500m;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

 # ─── Admin API ────────────────────────────────────────────────
location ^~ /admin/api/ {
    # The admin Next app uses basePath=/admin, so preserve the public
    # /admin prefix for its route handlers.
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Legacy API paths → Admin API
# Keep browser URL as /api/...

location ^~ /api/auth/ { return 307 /admin$request_uri; }
location ^~ /api/cookies/ { return 307 /admin$request_uri; }
location ^~ /api/cms/ { return 307 /admin$request_uri; }
location ^~ /api/customers { return 307 /admin$request_uri; }
location ^~ /api/collections { return 307 /admin$request_uri; }
location ^~ /api/content/ { return 307 /admin$request_uri; }
location ^~ /api/leads { return 307 /admin$request_uri; }
location = /api/settings { return 307 /admin$request_uri; }
location = /api/media { return 307 /admin$request_uri; }
  # ─── admin panel (/admin/*) ──────────────────────────────────
  # Redirect /admin → /admin/  (trailing slash is required by Next.js basePath)
  location = /admin {
    return 301 /admin/;
  }

  # /admin/_next/static/  →  /_next/static/  (strip /admin prefix)
  # location ^~ /admin/_next/static/ {
  #   proxy_pass http://$admin_upstream/_next/static/;
  #   proxy_http_version 1.1;
  #   proxy_set_header Connection close;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   expires 30d;
  #   add_header Cache-Control "public, immutable";
  # }

  # /admin/_next/image  →  /_next/image  (strip /admin prefix)
  # location ^~ /admin/_next/image {
  #   proxy_pass http://$admin_upstream/_next/image;
  #   proxy_http_version 1.1;
  #   proxy_set_header Connection close;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  # All other /admin/*  →  admin:3003 keeping /admin prefix
  location ^~ /admin/ {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ─── frontend static ─────────────────────────────────────────
  location ~* ^/(?:_next/static|_next/image|font-face|static)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/(?:fonts|brand|images|videos)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # ─── catch-all → frontend ────────────────────────────────────
  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
