server {
  listen 80;
  listen 443 ssl;
  server_name _;

  # A self-signed certificate enables HTTPS access by IP address. Browsers
  # intentionally display a warning until a domain-backed trusted certificate
  # replaces these files.
  ssl_certificate /etc/nginx/certs/ip.crt;
  ssl_certificate_key /etc/nginx/certs/ip.key;

  # Docker's embedded DNS assigns a new IP whenever a service is recreated.
  # Resolve service names at request time instead of keeping the IP that was
  # returned when nginx started (a stale IP causes intermittent 502 errors).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend_upstream frontend:3000;
  set $backend_upstream backend:3001;
  set $admin_upstream admin:3000;

  # Backend accepts media up to 200 MB; nginx must not reject the request
  # first with its default 1 MB HTML error page.
  client_max_body_size 200m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # ===================================================================
  # STATIC UPLOADS from backend (shared volume mount)
  # ===================================================================
  location ^~ /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
  }

  # ===================================================================
  # FRONTEND STOREFRONT — Next.js public routes
  # ===================================================================

  # Frontend static assets (_next/js, css, images, fonts)
  location ~* ^/(?:_next/static|_next/image|font-face|static)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection close;
  }

  # Frontend local assets (fonts, brand, images, videos)
  location ~* ^/(?:fonts|brand|images|videos)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection close;

    expires 365d;
    add_header Cache-Control "public";
  }

  # All other storefront requests → frontend
  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
  }

  # ===================================================================
  # ADMIN PANEL — Next.js app under /admin prefix
  # ===================================================================

  # Admin internal static assets (_next/js, css, images, fonts)
  location ^~ /admin/_next/static/ {
    proxy_pass http://$admin_upstream/_next/static;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection close;

    # Hashed asset filenames are immutable — cache forever
    expires 30d;
    add_header Cache-Control "public,no-transform";
  }

  # Admin image optimization endpoint
  location ^~ /admin/_next/image {
    proxy_pass http://$admin_upstream/_next/image;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection close;
  }

  # Admin application routes (pages/layout)
  location ^~ /admin/ {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
  }

  # ===================================================================
  # API PROXY LAYERS
  # ===================================================================

  # Public storefront CMS API – backend
  location ^~ /api/public-cms/ {
    proxy_pass http://$backend_upstream/api/public-cms;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public shop/checkout (no cookie required for browsing)
  location ^~ /api/shop/products/slug/ {
    proxy_pass http://$backend_upstream/api/shop/products/slug;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Shop catalog + public endpoints – backend
  location ^~ /api/shop/ {
    proxy_pass http://$backend_upstream/api/shop;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Auth session cookies — admin
  location ^~ /api/auth/login/ { proxy_pass http://$admin_upstream/api/auth/login; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  # CMS management routes — admin (protected, needs cookie)
  location ^~ /api/cms/ {
    proxy_pass http://$admin_upstream/api/cms;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Customers workspace — admin (protected)
  location ^~ /api/customers {
    proxy_pass http://$admin_upstream/api/customers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Settings — admin (protected)
  location = /api/settings {
    proxy_pass http://$admin_upstream/api/settings;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cookie/session refresh — admin
  location ^~ /api/cookies/ {
    proxy_pass http://$admin_upstream/api/cookies;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media upload — admin
  location = /api/media {
    proxy_pass http://$admin_upstream/api/media;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Content AI (chobonevis) — admin
  location ^~ /api/content/ {
    proxy_pass http://$admin_upstream/api/content;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Catch-all API → backend (for any unmatched /api/* routes)
  location /api/ {
    proxy_pass http://$backend_upstream/api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
} 
