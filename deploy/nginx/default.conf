server {
  listen 80;
  listen 443 ssl;

  server_name _;

  # ================================================================
  # SSL
  # ================================================================

  ssl_certificate     /etc/nginx/certs/ip.crt;
  ssl_certificate_key /etc/nginx/certs/ip.key;


  # ================================================================
  # Docker DNS / Upstreams
  # ================================================================

  resolver 127.0.0.11 valid=10s ipv6=off;

  set $frontend_upstream frontend:3000;
  set $backend_upstream  backend:3001;
  set $admin_upstream    admin:3003;


  # ================================================================
  # Proxy / Upload settings
  # ================================================================

  client_max_body_size 200m;

  proxy_connect_timeout 30s;
  proxy_read_timeout    300s;
  proxy_send_timeout    300s;

  proxy_buffer_size       128k;
  proxy_buffers           4 256k;
  proxy_busy_buffers_size 256k;


  # ================================================================
  # STATIC UPLOADS
  # Backend shared volume
  # ================================================================

  location ^~ /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
  }


  # ================================================================
  # PUBLIC API → BACKEND
  # ================================================================

  location ^~ /api/public-cms/ {
    proxy_pass http://$backend_upstream/api/public-cms;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  location ^~ /api/public/collections {
    proxy_pass http://$backend_upstream/public/collections;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  location ^~ /api/shop/ {
    proxy_pass http://$backend_upstream/api/shop;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  # ================================================================
  # ADMIN API → ADMIN :3003
  # ================================================================

  location ^~ /api/auth/ {
    proxy_pass http://$admin_upstream/api/auth/;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location ^~ /api/cookies/ {
    proxy_pass http://$admin_upstream/api/cookies/;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location ^~ /api/cms/ {
    proxy_pass http://$admin_upstream/api/cms/;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location ^~ /api/customers {
    proxy_pass http://$admin_upstream/api/customers;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location = /api/settings {
    proxy_pass http://$admin_upstream/api/settings;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location = /api/media {
    proxy_pass http://$admin_upstream/api/media;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location ^~ /api/collections {
    proxy_pass http://$admin_upstream/api/collections;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  location ^~ /api/content/ {
    proxy_pass http://$admin_upstream/api/content/;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
  }


  # ================================================================
  # ADMIN PANEL
  #
  # Next.js:
  #   basePath: "/admin"
  #
  # Therefore /admin/... MUST reach admin:3003 as /admin/...
  # ================================================================

  # location = /admin {
  #   return 301 /admin;
  # }


  # Next.js static files
  #
  # IMPORTANT:
  # Do NOT remove /admin from the URI.
  #

  location ^~ /admin/_next/static/ {
    proxy_pass http://$admin_upstream;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Connection close;

    expires 30d;
    add_header Cache-Control "public, immutable";
  }


  # Next.js image optimizer

  location ^~ /admin/_next/image {
    proxy_pass http://$admin_upstream;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Connection close;
  }


  # All Admin pages / routes

  location ^~ /admin {
    proxy_pass http://$admin_upstream;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_set_header Accept-Encoding   "";

    proxy_buffering off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }


  # ================================================================
  # FRONTEND STATIC
  # ================================================================

  location ~* ^/(?:_next/static|_next/image|font-face|static)/ {
    proxy_pass http://$frontend_upstream;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Connection close;

    expires 30d;
    add_header Cache-Control "public, immutable";
  }


  # Frontend assets

  location ~* ^/(?:fonts|brand|images|videos)/ {
    proxy_pass http://$frontend_upstream;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Connection close;

    expires 30d;
    add_header Cache-Control "public, immutable";
  }


  # ================================================================
  # STOREFRONT → FRONTEND
  # ================================================================

  location / {
    proxy_pass http://$frontend_upstream;

    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Accept-Encoding "";

    proxy_buffering off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
