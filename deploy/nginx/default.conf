server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend_upstream frontend:3000;
  set $backend_upstream  backend:3001;
  set $admin_upstream    admin:3003;
  set $landing_upstream  landing:5005;

  client_max_body_size   200m;
  proxy_connect_timeout  30s;
  proxy_read_timeout     300s;
  proxy_send_timeout     300s;
  proxy_buffer_size      128k;
  proxy_buffers          4 256k;
  proxy_busy_buffers_size 256k;

  # ─── static uploads ───────────────────────────────────────────
  location ^~ /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
    # Uploaded videos are streamed directly by nginx (including byte-range
    # requests) and cached by the browser, rather than passing through Next.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Accept-Ranges bytes;
  }

  # ─── campaign landing (/landing/*) ───────────────────────────
  location = /52 {
    # Next.js canonicalizes this base-path root to /landing (without a
    # trailing slash). Proxy it instead of redirecting to /landing/, which
    # would otherwise create an endless 301 ↔ 308 redirect loop.
    proxy_pass http://$landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }

  # Keep the /landing prefix: the separate Next.js app is built with this
  # basePath, preventing its assets and routes from colliding with storefront.
  location ^~ /52/ {
    proxy_pass http://$landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
  }
  # ─── public api → backend ────────────────────────────────────
  location ^~ /api/public-cms/ {
    # With a variable upstream, including a URI in proxy_pass discards the
    # unmatched request suffix. Preserve the complete API URI instead.
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/public/ {
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/shop/ {
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ─── public form submissions → backend ───────────────────────
  location = /api/lead {
    proxy_pass http://$backend_upstream/api/lead;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/interior-brief {
    proxy_pass http://$backend_upstream/api/interior-brief;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ─── admin api → admin:3003 ──────────────────────────────────
 # ─── Admin media upload ───────────────────────────────────────
# Keep the larger limit and longer timeout scoped to multipart media uploads.
location = /admin/api/media {
    client_max_body_size 500m;
    # The admin application has `/admin/*` pages but its route handlers live
    # under `/api/*`; keep this specialised upload route aligned with the
    # general admin API proxy below.
    rewrite ^/admin(/api/media)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

 # ─── Admin API ────────────────────────────────────────────────
location ^~ /admin/api/ {
    # The public panel lives under /admin, but its Next route handlers are
    # defined at /api. Strip only the public prefix before proxying.
    rewrite ^/admin(/api/.*)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Legacy API paths → Admin API
# Keep browser URL as /api/...

location ^~ /api/auth/ { return 307 /admin$request_uri; }
location ^~ /api/cookies/ { return 307 /admin$request_uri; }
location ^~ /api/cms/ { return 307 /admin$request_uri; }
location ^~ /api/customers { return 307 /admin$request_uri; }
location ^~ /api/collections { return 307 /admin$request_uri; }
location ^~ /api/content/ { return 307 /admin$request_uri; }
location ^~ /api/leads { return 307 /admin$request_uri; }
location = /api/settings { return 307 /admin$request_uri; }
location = /api/media { return 307 /admin$request_uri; }
  # ─── admin panel (/admin/*) ──────────────────────────────────
  # Next canonicalizes `/admin/` to `/admin`. Do not redirect this back to a
  # trailing slash here, otherwise nginx and Next create a 301 ↔ 308 loop.
  location = /admin {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # The asset prefix is public-only. The standalone Next server serves these
  # paths without `/admin`, so strip it before proxying.
  location ^~ /admin/_next/static/ {
    rewrite ^/admin(/_next/static/.*)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ^~ /admin/_next/image {
    rewrite ^/admin(/_next/image.*)$ $1 break;
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # All other /admin/*  →  admin:3003 keeping /admin prefix
  location ^~ /admin/ {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ─── frontend static ─────────────────────────────────────────
  location ~* ^/(?:_next/static|_next/image|font-face|static)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/(?:fonts|brand|images|videos)/ {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # ─── catch-all → frontend ────────────────────────────────────
  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
