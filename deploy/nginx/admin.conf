# Shared admin routes for admin.__SITE_DOMAIN__
# Included inside the admin server block in http-only.conf and https.conf.

resolver 127.0.0.11 valid=10s ipv6=off;
set $admin_upstream    admin:3003;
set $backend_upstream  backend:3001;

client_max_body_size   500m;
proxy_connect_timeout  30s;
proxy_read_timeout     300s;
proxy_send_timeout     300s;
proxy_buffer_size      128k;
proxy_buffers          4 256k;
proxy_busy_buffers_size 256k;

# ─── static uploads for media preview in admin ───────────────────
location ^~ /uploads/ {
  alias /var/www/uploads/;
  autoindex off;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable";
  add_header Accept-Ranges bytes;
}

# ─── admin media upload → backend (bypasses Next.js body limits) ─
location = /admin/api/media {
  client_max_body_size 500m;
  client_body_buffer_size 16m;
  client_body_timeout 900s;
  rewrite ^ /api/admin/upload break;
  proxy_pass http://$backend_upstream$uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
}

location ^~ /admin/api/media {
  client_max_body_size 500m;
  client_body_buffer_size 16m;
  client_body_timeout 900s;
  rewrite ^ /api/admin/upload break;
  proxy_pass http://$backend_upstream$uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
}

location ^~ /admin/api/files/upload {
  client_max_body_size 500m;
  client_body_buffer_size 16m;
  client_body_timeout 900s;
  rewrite ^ /api/admin/files/upload break;
  proxy_pass http://$backend_upstream$uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
}

location = /api/admin/upload {
  client_max_body_size 500m;
  client_body_buffer_size 16m;
  client_body_timeout 900s;
  proxy_pass http://$backend_upstream$uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
}

# ─── admin API handlers (Next.js route handlers under /api) ──────
location ^~ /admin/api/ {
  rewrite ^/admin(/api/.*)$ $1 break;
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# Direct /api/auth/ or other admin route handlers if called without /admin
location ^~ /api/auth/ {
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ─── static Next.js assets with /admin assetPrefix ───────────────
location ^~ /admin/_next/static/ {
  rewrite ^/admin(/_next/static/.*)$ $1 break;
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Connection close;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  expires 30d;
  add_header Cache-Control "public, immutable";
}

location ^~ /_next/static/ {
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Connection close;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  expires 30d;
  add_header Cache-Control "public, immutable";
}

location ^~ /admin/_next/image {
  rewrite ^/admin(/_next/image.*)$ $1 break;
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Connection close;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

location ^~ /_next/image {
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Connection close;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# ─── Next.js HMR in dev ──────────────────────────────────────────
location /_next/webpack-hmr {
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_buffering off;
}

# ─── all other admin routes (/, /admin, /admin/*) ────────────────
location / {
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
