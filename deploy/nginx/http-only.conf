# Used until a certificate exists for __SITE_DOMAIN__ (see 40-select-site.sh).
# Serves the site over HTTP and answers Let's Encrypt HTTP-01 challenges.

server {
  listen 80;
  server_name www.__SITE_DOMAIN__;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 http://__SITE_DOMAIN__$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name __SITE_DOMAIN__ _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/site/app.conf;
}
