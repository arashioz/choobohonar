services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data

  backend:
    image: ${REGISTRY_PREFIX:-choobohonar}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://mirror-npm.runflare.com
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/choob-va-honar
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend/uploads:/app/uploads
    expose:
      - '3001'
    depends_on:
      - mongo
      - redis

  frontend:
    image: ${REGISTRY_PREFIX:-choobohonar}/frontend:${IMAGE_TAG:-latest}
    build:
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_TELEMETRY_DISABLED: '1'
        NPM_REGISTRY: https://mirror-npm.runflare.com
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      API_URL: http://backend:3001/api
    expose:
      - '3000'
    depends_on:
      - backend

  admin:
    image: ${REGISTRY_PREFIX:-choobohonar}/admin:${IMAGE_TAG:-latest}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ASSET_PREFIX: /admin
        NPM_REGISTRY: https://mirror-npm.runflare.com
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      API_URL: http://backend:3001/api
      API_PROXY_TARGET: http://backend:3001/api
      NEXT_PUBLIC_BASE_URL: /admin
    expose:
      - '3003'
    depends_on:
      - backend

  landing:
    image: ${REGISTRY_PREFIX:-choobohonar}/landing:${IMAGE_TAG:-latest}
    build:
      # campaign-52 is a separate project next to this repository.
      context: ./campaign-52
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${LANDING_PUBLIC_URL:-http://localhost/landing}
        NEXT_PUBLIC_MAIN_SITE_URL: ${FRONTEND_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5005
      NEXT_PUBLIC_SITE_URL: ${LANDING_PUBLIC_URL:-http://localhost/landing}
      NEXT_PUBLIC_MAIN_SITE_URL: ${FRONTEND_URL:-http://localhost}
    expose:
      - '5005'

  nginx:
    image: ${REGISTRY_PREFIX:-choobohonar}/nginx:${IMAGE_TAG:-latest}
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./backend/uploads:/var/www/uploads:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - admin
      - landing
