services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data

  backend:
    image: ${REGISTRY_PREFIX:-choobohonar}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://package-mirror.liara.ir/repository/npm/
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/choob-va-honar
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Secure cookies; enable only once the site is served over HTTPS.
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend/uploads:/app/uploads
    expose:
      - '3001'
    depends_on:
      - mongo
      - redis

  frontend:
    image: ${REGISTRY_PREFIX:-choobohonar}/frontend:${IMAGE_TAG:-latest}
    build:
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_TELEMETRY_DISABLED: '1'
        NPM_REGISTRY: https://package-mirror.liara.ir/repository/npm/
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      API_URL: http://backend:3001/api
    volumes:
      # Large storefront media is managed on the host and must survive image rebuilds.
      - ./frontend/public/brand:/app/public/brand:ro
      - ./frontend/public/images:/app/public/images:ro
      - ./frontend/public/videos:/app/public/videos:ro
    expose:
      - '3000'
    depends_on:
      - backend

  admin:
    image: ${REGISTRY_PREFIX:-choobohonar}/admin:${IMAGE_TAG:-latest}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ASSET_PREFIX: /admin
        NPM_REGISTRY: https://package-mirror.liara.ir/repository/npm/
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      API_URL: http://backend:3001/api
      API_PROXY_TARGET: http://backend:3001/api
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      NEXT_PUBLIC_BASE_URL: /admin
    volumes:
      # Raster brandbook assets are delivered outside Git. Keep them on the
      # host so an admin-image rebuild never removes them.
      - ./admin/public/brand:/app/public/brand:ro
    expose:
      - '3003'
    depends_on:
      - backend

  landing:
    image: ${REGISTRY_PREFIX:-choobohonar}/landing:${IMAGE_TAG:-latest}
    build:
      # campaign-52 is a separate project next to this repository.
      context: ./campaign-52
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${LANDING_PUBLIC_URL:-http://localhost/landing}
        NEXT_PUBLIC_MAIN_SITE_URL: ${FRONTEND_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5005
      NEXT_PUBLIC_SITE_URL: ${LANDING_PUBLIC_URL:-http://localhost/landing}
      NEXT_PUBLIC_MAIN_SITE_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      # Campaign-specific public assets must remain available inside the
      # landing container; mounting frontend directories here hides them.
      - ./campaign-52/public/brand:/app/public/brand:ro
      - ./campaign-52/public/images:/app/public/images:ro
      - ./campaign-52/public/videos:/app/public/videos:ro
    expose:
      - '5005'

  nginx:
    image: ${REGISTRY_PREFIX:-choobohonar}/nginx:${IMAGE_TAG:-latest}
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-choobohonar.com}
      # Old WordPress host (e.g. https://1.2.3.4) for /wp-content/uploads
      # files that have not been copied into ./data/legacy yet.
      LEGACY_WP_ORIGIN: ${LEGACY_WP_ORIGIN:-}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./backend/uploads:/var/www/uploads:ro
      # Optional copy of WordPress media: ./data/legacy/wp-content/uploads/…
      - ./data/legacy:/var/www/legacy:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - admin
      - landing

  certbot:
    image: docker.arvancloud.ir/certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Renewal only; the first certificate is issued by deploy/init-ssl.sh.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
