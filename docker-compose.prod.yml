services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/choob-va-honar
      FRONTEND_URL: http://95.38.165.133,http://95.38.165.133:3003
      ADMIN_USER: choobhonar
      ADMIN_PASS: admin123
      JWT_SECRET: changeme_secret
      NODE_ENV: production
      # The backend must use the Docker service, never localhost inside its
      # own container. BullMQ needs this connection during application boot.
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend/uploads:/app/uploads
    expose:
      - '3001'
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
    expose:
      - '3000'
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      API_URL: http://backend:3001/api
      API_PROXY_TARGET: http://backend:3001/api
    expose:
      - '3000'
    depends_on:
      - backend

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # bind nginx to the specified host IP (public IP)
      - '95.38.165.133:80:80'
    volumes:
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
      - admin
