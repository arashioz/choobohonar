services:
  campaign:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://52.choobohonar.com}
        NEXT_PUBLIC_MAIN_SITE_URL: ${NEXT_PUBLIC_MAIN_SITE_URL:-https://choobohonar.com}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://52.choobohonar.com}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - campaign
